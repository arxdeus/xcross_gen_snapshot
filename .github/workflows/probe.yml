name: probe
on:
  workflow_dispatch:
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | ForEach-Object { Write-Host "== $($_.FullName)"; Get-ChildItem "$($_.FullName)\arm64","$($_.FullName)\x64" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   $($_.FullName)" } }
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
      - shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS=%%i
          echo VS=%VS%
          for %%a in (amd64 amd64_arm64 arm64 arm64_amd64) do (
            echo ===== %%a
            cmd /c ""%VS%\VC\Auxiliary\Build\vcvarsall.bat" %%a 10.0.26100.0 >NUL && where cl.exe && echo INCLUDE=%%INCLUDE%% && echo LIB=%%LIB%%"
          )
