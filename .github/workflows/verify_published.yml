name: verify_published

# Proves the PUBLISHED compilers of a release (the gen_snapshot zips and
# manifest.json of the GitHub release named after a Flutter version) on the
# corpus of docs/CORPUS.md, without rebuilding them: a macOS job builds every
# corpus app with the official toolchain and records the App sha256 Flutter's
# own gen_snapshot produces, then every host x mode downloads its published
# zip, checks it against manifest.json and recompiles every corpus app.dill,
# which must give a byte-identical App.

on:
  workflow_dispatch:
    inputs:
      flutter:
        description: Flutter version of the published release to verify (e.g. 3.47.6)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-published-${{ inputs.flutter }}
  cancel-in-progress: true

env:
  DART_VERSION: '3.13.5'
  FLUTTER_VERSION: ${{ inputs.flutter }}

jobs:
  corpus:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Test the tooling
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib bin test
          dart analyze --fatal-infos
          dart test
      - name: Download the published manifest
        run: |
          if ! [[ "$FLUTTER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a Flutter version: $FLUTTER_VERSION"; exit 1
          fi
          for i in 1 2 3 4 5; do
            gh release download "$FLUTTER_VERSION" -R "$GITHUB_REPOSITORY" \
              -p manifest.json -O manifest.json --clobber && break
            [ "$i" = 5 ] && exit 1; sleep $((i * 10))
          done
          cat manifest.json
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          for _ in 1 2 3; do
            git clone --depth 1 -b "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter "$RUNNER_TEMP/flutter" && break
            rm -rf "$RUNNER_TEMP/flutter"; sleep 20
          done
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          engine=$(cat "$RUNNER_TEMP/flutter/bin/internal/engine.version")
          published=$(jq -r .engine manifest.json)
          if [ "$engine" != "$published" ]; then
            echo "::error::Flutter $FLUTTER_VERSION has engine $engine, the release was built for $published"
            exit 1
          fi
      - name: Precache iOS artifacts
        run: |
          flutter config --no-analytics
          flutter --version
          for _ in 1 2 3; do flutter precache --ios && break; sleep 20; done
      - name: Build the corpus with the official toolchain
        run: bash tool/build_corpus.sh "$RUNNER_TEMP/corpus" corpus-ref
      - name: Check the default app against the manifest
        run: |
          # ref_app is the app the release itself was proven on.
          for mode in release profile; do
            want=$(jq -r ".verification.${mode}_app_sha256" manifest.json)
            got=$(jq -r .app_sha256 "corpus-ref/ref_app/$mode/official.json")
            echo "ref_app $mode manifest=$want official=$got"
            [ "$got" = "$want" ] || echo "::warning::ref_app $mode differs from the manifest (a different runner image can change the default app's kernel)"
          done
      - name: Summary
        run: |
          {
            echo "### Corpus for Flutter $FLUTTER_VERSION (official App sha256)"
            echo "| app | mode | App sha256 | App bytes | dill bytes |"
            echo "|---|---|---|---|---|"
            for f in corpus-ref/*/*/official.json; do
              mode=$(basename "$(dirname "$f")")
              app=$(basename "$(dirname "$(dirname "$f")")")
              echo "| $app | $mode | \`$(jq -r .app_sha256 "$f")\` | $(jq -r .app_size "$f") | $(wc -c < "corpus-ref/$app/$mode/app.dill" | tr -d ' ') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-ref
          path: |
            corpus-ref/
            manifest.json
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: corpus
    strategy:
      fail-fast: false
      matrix:
        host: [linux-x64, linux-arm64, windows-x64, windows-arm64]
        mode: [release, profile]
        include:
          - {host: linux-x64, runner: ubuntu-24.04}
          - {host: linux-arm64, runner: ubuntu-24.04-arm}
          - {host: windows-x64, runner: windows-2022}
          - {host: windows-arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: gen_snapshot-${{ matrix.mode }}-${{ matrix.host }}.zip
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: dart pub get
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-ref
          path: .
      - name: Download the published compiler
        run: |
          mkdir -p published
          for i in 1 2 3 4 5; do
            gh release download "$FLUTTER_VERSION" -R "$GITHUB_REPOSITORY" \
              -p "$ASSET" -p manifest.json -D published --clobber && break
            [ "$i" = 5 ] && exit 1; sleep $((i * 10))
          done
          # The corpus job checked the engine against this same manifest.
          cmp published/manifest.json manifest.json
          ls -la published
      - name: Verify byte identity on every corpus app
        run: |
          bash tool/verify_corpus.sh "published/$ASSET" corpus-ref "${{ matrix.mode }}" \
            "results/${{ matrix.mode }}-${{ matrix.host }}" \
            --manifest published/manifest.json --flutter "$FLUTTER_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: results-${{ matrix.mode }}-${{ matrix.host }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  summary:
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Summary
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          {
            echo "### Published compilers of Flutter $FLUTTER_VERSION on the corpus"
            echo "| host / mode | app | App sha256 | identical |"
            echo "|---|---|---|---|"
            for f in results/*/*.json; do
              [ -f "$f" ] || continue
              run=$(basename "$(dirname "$f")")
              app=$(basename "$f" .json)
              ok=yes; [ -d "results/$run/mismatch/$app" ] && ok=NO
              echo "| $run | $app | \`$(jq -r .app_sha256 "$f")\` | $ok |"
            done
            echo
            echo "verify jobs: $VERIFY_RESULT"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$VERIFY_RESULT" = success ]
